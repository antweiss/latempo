[package]
name = "latempo"
version = "0.1.0"
edition = "2021"
authors = ["Latempo Team"]
description = "AI Workflow Generator - Transform natural language into production-ready Temporal workflows"
license = "MIT"

[[bin]]
name = "latempo"
path = "src/main.rs"

[dependencies]
# CLI & TUI
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"

# Async Runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# AWS SDK
aws-config = "1.1"
aws-sdk-secretsmanager = "1.13"
aws-sdk-dynamodb = "1.13"
aws-sdk-s3 = "1.15"
aws-sdk-ecs = "1.13"
aws-sdk-apigateway = "1.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Templates
tera = "1.19"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
dotenv = "0.15"
tempfile = "3.10"
sha2 = "0.10"

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
